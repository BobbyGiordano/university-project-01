services:
  postgres:
    image: postgres:16-alpine
    container_name: hextitanium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hexadmin
      POSTGRES_PASSWORD: hexpassword123
      POSTGRES_DB: hextitanium_db
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexadmin -d hextitanium_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: hextitanium-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://hexadmin:hexpassword123@postgres:5432/hextitanium_db?schema=public"
      JWT_SECRET: "hex-titanium-secure-local-jwt-secret-2026"
      PORT: 3000
      HOST: "0.0.0.0"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/server/uploads
