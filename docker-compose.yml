services:
  postgres:
    image: postgres:16-alpine
    container_name: hextitanium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hexadmin
      POSTGRES_PASSWORD: hexpassword123
      POSTGRES_DB: hextitanium_db
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexadmin -d hextitanium_db"]
      interval: 5s
      timeout: 5s
      retries: 5

