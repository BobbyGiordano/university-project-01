<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="nmaxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#09090b" rx="16"/>
  
  <!-- Motorcycle Silhouette Outline: Maxi Scooter NMAX -->
  <!-- Wheels -->
  <circle cx="150" cy="270" r="55" fill="#18181b" stroke="#38bdf8" stroke-width="3" stroke-dasharray="12 4"/>
  <circle cx="150" cy="270" r="32" fill="#09090b" stroke="#52525b" stroke-width="2"/>
  
  <circle cx="450" cy="270" r="55" fill="#18181b" stroke="#38bdf8" stroke-width="3" stroke-dasharray="12 4"/>
  <circle cx="450" cy="270" r="32" fill="#09090b" stroke="#52525b" stroke-width="2"/>
  
  <!-- Body Frame -->
  <path d="M 150 270 L 220 230 L 290 230 L 370 200 L 450 270 L 380 270 L 320 260 L 250 270 Z" fill="url(#nmaxGrad)" stroke="#38bdf8" stroke-width="2"/>
  <!-- Front Cowl & Windshield -->
  <path d="M 180 210 L 140 160 L 190 120 L 220 160 Z" fill="#0284c7" opacity="0.8"/>
  <path d="M 190 120 L 210 90 L 235 120 Z" fill="#38bdf8" opacity="0.6"/>
  <!-- Dual LED Headlamp Glow -->
  <polygon points="140,165 170,180 150,195" fill="#38bdf8"/>
  <!-- Handlebars & Seat -->
  <path d="M 230 145 L 250 160 L 380 175 L 420 200" stroke="#71717a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- CVT Highlight Point -->
  <circle cx="390" cy="270" r="14" fill="#38bdf8" opacity="0.3"/>
  <circle cx="390" cy="270" r="6" fill="#38bdf8"/>
  <text x="390" y="305" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">CVT 11x BAUT</text>

  <!-- Title Badge -->
  <g transform="translate(40, 40)">
    <rect width="210" height="60" rx="8" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="26" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="11">YAMAHA MATIC 155CC</text>
    <text x="16" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="15">NMAX 155 Connected</text>
  </g>
</svg>

