<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="doffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="50%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#09090b" rx="16"/>
  
  <!-- Rounded Dome Head -->
  <path d="M 120 220 C 120 130 260 130 260 220 Z" fill="url(#doffGrad)" stroke="#52525b" stroke-width="2"/>
  <!-- Hex Key Socket -->
  <polygon points="190,165 205,173 205,191 190,200 175,191 175,173" fill="#18181b" stroke="#71717a" stroke-width="1.5"/>
  
  <!-- Bolt Shaft -->
  <rect x="155" y="220" width="70" height="150" fill="url(#doffGrad)" stroke="#3f3f46" stroke-width="1.5"/>
  <!-- Thread Lines -->
  <g stroke="#27272a" stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="245" x2="230" y2="255"/>
    <line x1="150" y1="265" x2="230" y2="275"/>
    <line x1="150" y1="285" x2="230" y2="295"/>
    <line x1="150" y1="305" x2="230" y2="315"/>
    <line x1="150" y1="325" x2="230" y2="335"/>
    <line x1="150" y1="345" x2="230" y2="355"/>
  </g>
  
  <g transform="translate(320, 110)">
    <rect width="240" height="200" rx="12" fill="#121215" stroke="#27272a" stroke-width="1.5"/>
    <text x="24" y="45" fill="#a1a1aa" font-family="system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="1">HEX TITANIUM SPEC</text>
    <text x="24" y="80" fill="#ffffff" font-family="monospace" font-weight="800" font-size="20">BUTTON HEAD</text>
    <text x="24" y="112" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">Grade: Ti-6Al-4V (Grade 5)</text>
    <text x="24" y="136" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">Head: Hex Socket / Dome</text>
    <text x="24" y="160" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">Finish: Matte Raw Doff</text>
    <rect x="24" y="174" width="70" height="6" rx="3" fill="#71717a"/>
  </g>
</svg>

